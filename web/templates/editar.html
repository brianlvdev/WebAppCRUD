<!DOCTYPE html>
<html lang="pt-br" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pessoa</title>
    <link href="{{ url_for('static', filename='daisyui.css') }}" rel="stylesheet" type="text/css" />
    <link href="{{ url_for('static', filename='themes.css') }}" rel="stylesheet" type="text/css" />
    <script src="{{ url_for('static', filename='tailwindcss.js') }}"></script>

</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">

    <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="flex justify-between items-center mb-4">
                <h1 class="card-title text-2xl">Editar Cadastro</h1>
                <span class="badge badge-outline font-mono">Cód: {{ pessoa['pid'] }}</span>
            </div>

            {% if erro %}
            <div class="alert alert-error text-sm mb-4">
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="label">
                        <span class="label-text">Nome <span class="text-xs opacity-60">(deixe vazio para manter)</span></span>
                    </label>
                    <input type="text" name="nome" placeholder="{{ pessoa['nome'] }}" class="input input-bordered w-full">
                </div>

                <div>
                    <label class="label">
                        <span class="label-text">Cargo <span class="text-xs opacity-60">(deixe vazio para manter)</span></span>
                    </label>
                    <input type="text" name="cargo" placeholder="{{ pessoa['cargo'] }}" class="input input-bordered w-full">
                </div>

                <div class="flex gap-2 pt-2">
                    <a href="{{ url_for('index') }}" class="btn btn-ghost flex-1">Voltar</a>
                    <button type="submit" class="btn btn-warning flex-1">Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
