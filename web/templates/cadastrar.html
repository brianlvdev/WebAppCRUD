<!DOCTYPE html>
<html lang="pt-br" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Pessoa</title>
    <link href="{{ url_for('static', filename='daisyui.css') }}" rel="stylesheet" type="text/css" />
    <link href="{{ url_for('static', filename='themes.css') }}" rel="stylesheet" type="text/css" />
    <script src="{{ url_for('static', filename='tailwindcss.js') }}"></script>

</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">

    <!-- Botão de Dark Mode fixo no canto superior direito -->
    <label class="fixed top-6 right-6 flex cursor-pointer gap-2 items-center">
        <!-- Ícone de Sol -->
        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        
        <input type="checkbox" value="dracula" class="toggle theme-controller" id="theme-toggle" />
        
        <!-- Ícone de Lua -->
        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </label>

    <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-2xl mb-4">Novo Cadastro</h1>

            {% if erro %}
            <div class="alert alert-error text-sm mb-4">
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="label"><span class="label-text">Nome</span></label>
                    <input type="text" name="nome" placeholder="Ex: Maria Silva" class="input input-bordered w-full" required>
                </div>

                <div>
                    <label class="label"><span class="label-text">Cargo</span></label>
                    <input type="text" name="cargo" placeholder="Ex: Desenvolvedora" class="input input-bordered w-full" required>
                </div>

                <div class="flex gap-2 pt-2">
                    <a href="{{ url_for('index') }}" class="btn btn-ghost flex-1">Voltar</a>
                    <button type="submit" class="btn btn-success flex-1">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        if (localStorage.getItem('tema') === 'dracula') {
            document.documentElement.setAttribute('data-theme', 'dracula');
        }
    </script>

</body>
</html>
